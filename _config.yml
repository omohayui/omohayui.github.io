title: omohayui.github.io
email: omohayui@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  This site is maintained by omohayui (Yui Takeuchi).
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://omohayui.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: omohayui
github_username:  omohayui

# Build settings
theme: plainwhite
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# `style: compressed` keeps the output identical in shape to what the legacy Pages
# build produced. The theme's stylesheets still use the legacy `@import` syntax, which
# dart-sass reports as deprecated; the theme is upstream code we don't edit, so the
# warning is silenced rather than fixed.
sass:
  style: compressed
  sourcemap: never
  silence_deprecations:
    - import

plainwhite:
  name: Yui Takeuchi
  tagline: Developer
  date_format: "%b %-d, %Y"
  portfolio_image:  "assets/portfolio.png"
  social_links:
    twitter: omohayui
    github: omohayui
    #linkedIn: in/samarsault # format: locale/username
  # GA4 measurement ID. This replaces UA-18159056-5, a Universal Analytics property
  # that stopped collecting data in July 2023.
  analytics_id: G-BHZW7WQEHJ
  sitemap: true
  navigation:
  - title: Blog
    url: "https://www.omohayui.com/"
  - title: Privacy Policy
    url: "/privacy-policy"

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
